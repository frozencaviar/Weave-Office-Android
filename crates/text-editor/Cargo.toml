[package]
name = "weave-text-editor"
version = "0.1.0"
edition = "2024"
description = "Markdown (live preview) and plain-text/code editor hosted by Weave Office"

[lib]
path = "src/lib.rs"

[dependencies]
egui = { version = "0.37", default-features = false }
weave-ribbon = { path = "../ribbon" }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
