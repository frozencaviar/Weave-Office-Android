[package]
name = "weave-office"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Unified desktop workspace for documents, spreadsheets, presentations and PDF"
license = "MIT"

[workspace]
members = ["crates/workspace", "crates/cli", "crates/pdf-backend", "crates/font-assets", "crates/system-fonts", "crates/ribbon", "crates/text-editor", "crates/rich-editor", "apps/weave-office-android"]
exclude = ["integration", "vendor/wordcraft", "vendor/gridcraft", "vendor/deckcraft", "vendor/pdfcraft"]
resolver = "2"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "clipboard", "links", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.44"
tempfile = "3"
weave-workspace = { path = "crates/workspace" }
# `weave-office <verb> …`: the command line over the same engines (create, view, run, batch …).
weave-cli = { path = "crates/cli" }
weave-font-assets = { path = "crates/font-assets" }
weave-system-fonts = { path = "crates/system-fonts" }
wordcraft-fonts = { path = "vendor/wordcraft/crates/fonts", features = ["shared-font-assets", "shared-system-fonts"] }
deckcraft-fonts = { path = "vendor/deckcraft/crates/fonts", features = ["shared-font-assets", "shared-system-fonts"] }
pdfcraft-fonts = { path = "vendor/pdfcraft/crates/fonts", features = ["shared-font-assets"] }
# The host draws every editor's ribbon tab row (crates/ribbon); the editors draw the commands below.
weave-ribbon = { path = "crates/ribbon" }
# Markdown (live preview) and plain-text/code editing.
weave-text-editor = { path = "crates/text-editor" }
# Rich-text (HTML) documents: design view and source view.
weave-rich-editor = { path = "crates/rich-editor" }
wordcraft-ui-egui = { path = "vendor/wordcraft/crates/ui-egui", default-features = false, features = ["shared-font-assets", "host-ribbon"] }
wordcraft-engine = { path = "vendor/wordcraft/crates/engine" }
wordcraft-doc = { path = "vendor/wordcraft/crates/doc" }
# Document reads WMF/EMF pictures with Presentation's reader: one metafile parser in the app.
wordcraft-metafile = { path = "vendor/wordcraft/crates/metafile", features = ["shared-metafile"] }
gridcraft-ui-egui = { path = "vendor/gridcraft/crates/ui-egui", default-features = false, features = ["shared-font-assets", "shared-system-fonts", "host-ribbon"] }
gridcraft-engine = { path = "vendor/gridcraft/crates/engine" }
# Spreadsheet PDF export and printing through the shared PDF engine, with embedded fonts.
gridcraft-pdf = { path = "vendor/gridcraft/crates/pdf", features = ["shared-pdf"] }
deckcraft-ui-egui = { path = "vendor/deckcraft/crates/ui-egui", default-features = false, features = ["host-ribbon"] }
deckcraft-engine = { path = "vendor/deckcraft/crates/engine" }
pdfcraft-ui-egui = { path = "vendor/pdfcraft/crates/ui-egui", default-features = false, features = ["shared-font-assets", "host-ribbon"] }
pdfcraft-engine = { path = "vendor/pdfcraft/crates/engine" }
pdfcraft-print = { path = "vendor/pdfcraft/crates/print" }
pdfcraft-platform = { path = "vendor/pdfcraft/crates/platform" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", features = ["egui"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Native file panels and the system clipboard: on Android the shell answers both through its
# bridges (SAF pickers, JNI clipboard), so neither crate is built there.
arboard = "3.7"
rfd = "0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
# The Android shell runs eframe on winit's GameActivity backend; the desktop keeps glow.
eframe = { version = "0.37", default-features = false, features = ["android-game-activity"] }

[target.'cfg(target_os = "macos")'.dependencies]
fmv-macos-events = "=0.1.0"
winit = { version = "0.30", default-features = false }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSEvent", "NSWindow", "NSResponder", "NSGraphicsContext", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSThread", "NSObject", "NSString"] }

[build-dependencies]
# Icon + VERSIONINFO for weave-office.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[[test]]
name = "native_app_menu"
harness = false

[patch.crates-io]
# Android stubs: rfd and arboard have no Android backend upstream; the vendored copies add one
# (dialogs cancelled, clipboard unsupported) so the shared crates compile for the target.
rfd = { path = "vendor/rfd" }
arboard = { path = "vendor/arboard" }
hayro-interpret = { path = "vendor/pdfcraft/vendor/hayro-interpret" }
hayro = { path = "vendor/pdfcraft/vendor/hayro" }
hayro-syntax = { path = "vendor/pdfcraft/vendor/hayro-syntax" }
hayro-cmap = { path = "vendor/pdfcraft/vendor/hayro-cmap" }
hayro-postscript = { path = "vendor/pdfcraft/vendor/hayro-postscript" }
hayro-jbig2 = { path = "vendor/pdfcraft/vendor/hayro-jbig2" }
lopdf = { path = "vendor/pdfcraft/vendor/lopdf" }
vello_common = { path = "vendor/pdfcraft/vendor/vello_common" }
vello_cpu = { path = "vendor/pdfcraft/vendor/vello_cpu" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = "symbols"
