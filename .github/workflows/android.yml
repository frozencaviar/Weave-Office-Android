name: Android

on:
  push:
    branches: [main]
    tags: ['android-v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-${{ hashFiles('Cargo.lock') }}

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.3.13750724'

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Font inputs
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/storytold/craft-fonts "$RUNNER_TEMP/craft-fonts"
          git -C "$RUNNER_TEMP/craft-fonts" checkout --detach 37827adc41fd165f9a9234ac40f94dbad353aa69
          mkdir -p "$RUNNER_TEMP/weave-document-fonts"
          cp scripts/document-fonts-manifest.txt "$RUNNER_TEMP/weave-document-fonts/manifest.txt"
          curl -fL -o "$RUNNER_TEMP/weave-document-fonts/NotoSerifCJKsc-Regular.otf" \
            https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Serif/OTF/SimplifiedChinese/NotoSerifCJKsc-Regular.otf
          curl -fL -o "$RUNNER_TEMP/weave-document-fonts/OFL.txt" \
            https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Serif/LICENSE
          git clone https://github.com/storytold/craft-i18n "$RUNNER_TEMP/craft-i18n"
          git -C "$RUNNER_TEMP/craft-i18n" checkout --detach "$(cat vendor/wordcraft/craft-i18n.rev)"

      - name: Host tests
        env:
          CRAFT_FONTS_DIR: ${{ runner.temp }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
          WEAVE_DOCUMENT_FONTS_DIR: ${{ runner.temp }}/weave-document-fonts
          WEAVE_DOCUMENT_FONTS_REQUIRED: '1'
          CRAFT_I18N_DIR: ${{ runner.temp }}/craft-i18n
          CRAFT_I18N_REQUIRED: '1'
        run: cargo test -p weave-office-android

      # The release key is committed (apps/weave-office-android/android/weave-release.jks), so this
      # APK updates a locally built one and the in-app updater works across both.
      - name: Build the APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
          CRAFT_FONTS_DIR: ${{ runner.temp }}/craft-fonts
          WEAVE_DOCUMENT_FONTS_DIR: ${{ runner.temp }}/weave-document-fonts
          CRAFT_I18N_DIR: ${{ runner.temp }}/craft-i18n
        run: apps/weave-office-android/build.sh

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: weave-office-android
          path: target/android/*.apk

  # A tag `android-v<version>` publishes a release the in-app updater can install: the APK is
  # attached and the tag names the version. `git tag android-v0.1.1 && git push origin android-v0.1.1`.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: weave-office-android
          path: apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#android-v}"
          gh release create "$TAG" apk/*.apk \
            --repo "${{ github.repository }}" \
            --title "Weave Office for Android $version" \
            --notes "Weave Office $version for Android tablets and phones (arm64-v8a, Android 8.0+).

          Download the APK below and sideload it with `adb install -r`, or let the app's own updater install it.

          See the [README](https://github.com/${{ github.repository }}#readme) for what the port adds and how to build it."
