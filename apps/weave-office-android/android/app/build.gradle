plugins {
    id 'com.android.application'
}

// The launcher icon comes from the shared app icon (assets/app-icon), copied at build time so the
// repository keeps one copy of it.
def iconRes = layout.buildDirectory.dir("generated/icon-res")
def copyIcon = tasks.register('copyLauncherIcon', Copy) {
    from(rootProject.file('../../../assets/app-icon/weave-office-256.png'))
    into(iconRes.map { it.dir('mipmap-xxxhdpi') })
    rename { 'ic_launcher.png' }
}

// The app version is the workspace's (Cargo.toml), so the APK never lags behind the app, plus the
// Android build number (RELEASE_BUILD, from build.sh) for repeat releases of one version.
def versionSource = System.getenv('APP_VERSION') ? "version = \"${System.getenv('APP_VERSION')}\"" : rootProject.file('../../../Cargo.toml').text
def cargoVersion = (versionSource =~ /(?m)^version = "(\d+)\.(\d+)\.(\d+)"/)[0]
def releaseBuild = (System.getenv('RELEASE_BUILD') ?: '0').toInteger()
def appVersionName = "${cargoVersion[1]}.${cargoVersion[2]}.${cargoVersion[3]}" + (releaseBuild > 0 ? "-${releaseBuild}" : '')
def appVersionCode = cargoVersion[1].toInteger() * 10000 + cargoVersion[2].toInteger() * 100 + cargoVersion[3].toInteger()

android {
    namespace 'local.weaveoffice.android'
    compileSdk 35
    // Pinned, so the build uses the build-tools the SDK has rather than AGP's default (34.0.0).
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'local.weaveoffice.android'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName + '-android'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // GameActivity calls into Java by name from native code: keep every class as is.
            minifyEnabled false
            // A prototype: signed with the debug key so it installs as is.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDirs += iconRes
        }
    }

    packaging {
        jniLibs {
            // Store the library uncompressed and page-aligned: loaded straight from the APK.
            useLegacyPackaging = false
        }
    }
}

tasks.named('preBuild') { dependsOn copyIcon }

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // The Java half of GameActivity; android-activity (Rust) provides the native glue.
    implementation 'androidx.games:games-activity:4.4.0'
}
